[package]
name = "wardby-viewer"
version = "0.1.0"
description = "Desktop viewer for wardby"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wardby_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-store = "2.5.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
keyring = "4.2.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"
