# Confines External Secrets Operator to the wardby-coding namespace.
#
# A default install can read and write Secrets in every namespace. With these
# values the controller only reconciles wardby-coding, its RBAC is a Role there
# rather than a ClusterRole, and it ignores every cluster-scoped and push
# resource, so nothing outside the namespace can use it to write a Secret. The
# cert-controller keeps a cluster-wide ClusterRole that reads Secrets and can
# write only one, named external-secrets-webhook: its own webhook certificate.
# The controller that writes wardby's Secrets is confined to wardby-coding.
scopedNamespace: wardby-coding
scopedRBAC: true
processClusterStore: false
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterGenerator: false
processPushSecret: false

# Explicit requests for the controller, webhook and cert-controller. The chart
# sets none, and Autopilot bills a pod without requests at its default of 500m
# CPU and 2 GiB of memory: about 1.5 vCPU and 6 GiB for three pods that idle at
# a few millicores and tens of MiB. 256Mi leaves several times their working
# set. The memory limit equals the request, so outgrowing it restarts one
# container (the Secrets it already wrote stay) rather than risking eviction;
# no CPU limit, so a reconcile or webhook call can burst instead of throttling.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
certController:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
