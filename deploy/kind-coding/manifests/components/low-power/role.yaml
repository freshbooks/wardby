# Low-power mode only: lets the control plane scale the coding proxy and the
# native gateway between 0 and 1 (src/core/power.ts), and read their Endpoints
# to tell when a woken target is ready. Named objects only; it cannot touch its
# own Deployment or anything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: wardby-power, namespace: wardby-coding }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["wardby-coding-proxy", "wardby-native-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["wardby-coding-proxy", "wardby-native-gateway"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: wardby-power, namespace: wardby-coding }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: wardby-power }
subjects:
  - { kind: ServiceAccount, name: wardby-control-plane, namespace: wardby-coding }
