# GKE only: the coding proxy's size. Sized from a measured `npm ci` of a real
# lockfile (React 19, Vite 8, Vitest 5, jsdom; ~220 packages) through the
# registry's on-demand dependency-graph walk, with the packument memory fix and
# the default 3-day release age: peak 1752 MiB RSS (heap 549 MiB). 3Gi leaves
# over 50% headroom. CPU is a full core (1:3, inside Autopilot's 1:1-1:6.5):
# at 500m, a lockfile install whose too-new pins fell back to the graph walk
# starved the event loop that also carries model traffic -- TLS handshakes
# timed out and a ledger transaction expired, failing the run. Lockfile
# verification now handles most installs without the walk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardby-coding-proxy
  namespace: wardby-coding
spec:
  template:
    spec:
      containers:
        - name: proxy
          resources:
            requests:
              cpu: 1000m
              memory: 3Gi
            limits:
              cpu: 1000m
              memory: 3Gi
