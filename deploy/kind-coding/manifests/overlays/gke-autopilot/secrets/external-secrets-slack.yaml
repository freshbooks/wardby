# Slack workflow notifications (docs/slack-notifications.md), synced only when
# the operator posts to Slack. Deliberately not listed in kustomization.yaml:
# deploy/gke/up.sh applies it when seed-secrets.mjs reports the Slack bot token
# set, and deletes it when it is not. The control plane reads the target Secret
# with optional: true, so a deployment without Slack starts without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-slack-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-slack-env
    creationPolicy: Owner
  data:
    - secretKey: WARDBY_SLACK_BOT_TOKEN
      remoteRef:
        key: wardby-secret-prefix-slack-bot-token
