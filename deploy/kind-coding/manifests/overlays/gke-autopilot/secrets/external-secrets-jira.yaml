# Jira Cloud settings (docs/jira-agents.md), synced only when the operator uses
# Jira. Deliberately not listed in kustomization.yaml: deploy/gke/up.sh applies
# it when seed-secrets.mjs reports every Jira secret set, and deletes it when
# none is. The control plane reads the target Secret with optional: true, so a
# deployment without Jira starts without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-jira-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-jira-env
    creationPolicy: Owner
  data:
    - secretKey: WARDBY_JIRA_SITE_URL
      remoteRef:
        key: wardby-secret-prefix-jira-site-url
    - secretKey: WARDBY_JIRA_API_BASE_URL
      remoteRef:
        key: wardby-secret-prefix-jira-api-base-url
    - secretKey: WARDBY_JIRA_API_TOKEN
      remoteRef:
        key: wardby-secret-prefix-jira-api-token
    - secretKey: WARDBY_JIRA_API_TOKEN_EXPIRES_AT
      remoteRef:
        key: wardby-secret-prefix-jira-api-token-expires-at
    - secretKey: WARDBY_JIRA_WEBHOOK_SECRET
      remoteRef:
        key: wardby-secret-prefix-jira-webhook-secret
