apiVersion: apps/v1
kind: Deployment
metadata: { name: wardby-control-plane, namespace: wardby-coding }
spec:
  template:
    spec:
      containers:
        - name: control-plane
          env:
            - { name: WARDBY_LOW_POWER, value: "1" }
            - { name: LOW_POWER_IDLE_MINUTES, value: "30" }
