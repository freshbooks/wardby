# Native sandbox gateway overlay (docs/native-sandbox.md). Use it with the base file:
#   docker compose -f deploy/local/docker-compose.yml -f deploy/local/docker-compose.native-sandbox.yml up -d --build native-gateway
#
# The gateway holds the LLM credentials and serves the sandbox workers' model calls and tool
# access. It never gets the Docker socket: the server (not this container) launches workers.
# The server must run with NATIVE_SANDBOX_LAUNCHER=docker, NATIVE_GATEWAY_CONTAINER set to the
# container_name below, and NATIVE_SANDBOX_WORKER_IMAGE set to a pinned worker image.
services:
  native-gateway:
    container_name: wardby-native-gateway
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["node", "dist/cli.js", "native-gateway"]
    environment:
      DATABASE_URL: postgresql://wardby:wardby@postgres:5432/wardby
      NATIVE_GATEWAY_LISTEN: 0.0.0.0:8790
      # Must match the server's value: the gateway decrypts secrets for tools that use them.
      SECRET_APP_KEY: ${SECRET_APP_KEY:?SECRET_APP_KEY must be set in .env.local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
