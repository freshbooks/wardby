# Coding proxy for the quickstart's optional coding step. Layered on
# docker-compose.yml (which provides the postgres service); runs a prebuilt
# runtime image instead of building one.
services:
  coding-proxy:
    container_name: wardby-coding-proxy
    image: ${WARDBY_RUNTIME_IMAGE:?WARDBY_RUNTIME_IMAGE must be set to the wardby runtime image}
    command: ["node", "dist/coding-proxy/main.js"]
    environment:
      # Same credentials as the postgres service in docker-compose.yml. The values
      # are interpolated as-is: quickstart's generated password is hex, and a
      # custom user or database name must be URL-safe.
      DATABASE_URL: postgresql://${WARDBY_POSTGRES_USER:-wardby}:${WARDBY_POSTGRES_PASSWORD:-wardby}@postgres:5432/${WARDBY_POSTGRES_DB:-wardby}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: production
      # Private registry (JFrog Artifactory): empty means public npm and PyPI. The
      # credential variables hold env:NAME references; the proxy resolves them from the
      # ARTIFACTORY_* values below. They stay in this container only.
      REGISTRY_JFROG_URL: ${REGISTRY_JFROG_URL:-}
      REGISTRY_JFROG_NPM_REPO: ${REGISTRY_JFROG_NPM_REPO:-}
      REGISTRY_JFROG_NPM_SCOPES: ${REGISTRY_JFROG_NPM_SCOPES:-}
      REGISTRY_JFROG_PYPI_REPO: ${REGISTRY_JFROG_PYPI_REPO:-}
      REGISTRY_JFROG_PYPI_TRUST_ALL: ${REGISTRY_JFROG_PYPI_TRUST_ALL:-}
      REGISTRY_UPSTREAM_USERNAME: ${REGISTRY_UPSTREAM_USERNAME:-}
      REGISTRY_UPSTREAM_PASSWORD: ${REGISTRY_UPSTREAM_PASSWORD:-}
      ARTIFACTORY_USER: ${ARTIFACTORY_USER:-}
      ARTIFACTORY_TOKEN: ${ARTIFACTORY_TOKEN:-}
      # Run dependency cache. Off unless WARDBY_DEPENDENCY_CACHE=true is in the
      # quickstart env file (.wardby/.env) or the shell: then the proxy keeps
      # snapshots on the named volume below. The flag alone switches it; the
      # blob store is unused while it is off.
      BLOB_STORE: local
      BLOB_STORE_LOCAL_DIR: /var/lib/wardby/blobs
      WARDBY_DEPENDENCY_CACHE: ${WARDBY_DEPENDENCY_CACHE:-false}
    volumes:
      - dependency-cache:/var/lib/wardby/blobs
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  # Snapshots survive proxy restarts; `docker compose down -v` removes them.
  dependency-cache:
