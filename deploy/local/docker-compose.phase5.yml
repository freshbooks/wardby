services:
  coding-proxy:
    container_name: wardby-coding-proxy
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: runtime
    command: ["node", "dist/coding-proxy/main.js"]
    environment:
      DATABASE_URL: postgresql://${WARDBY_POSTGRES_USER:-wardby}:${WARDBY_POSTGRES_PASSWORD:-wardby}@postgres:5432/${WARDBY_POSTGRES_DB:-wardby}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env.local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set in .env.local}
      NODE_ENV: production
      # Private registry (JFrog Artifactory): empty means public npm and PyPI. The
      # credential variables hold env:NAME references; the proxy resolves them from the
      # ARTIFACTORY_* values below. They stay in this container only.
      REGISTRY_JFROG_URL: ${REGISTRY_JFROG_URL:-}
      REGISTRY_JFROG_NPM_REPO: ${REGISTRY_JFROG_NPM_REPO:-}
      REGISTRY_JFROG_NPM_SCOPES: ${REGISTRY_JFROG_NPM_SCOPES:-}
      REGISTRY_JFROG_PYPI_REPO: ${REGISTRY_JFROG_PYPI_REPO:-}
      REGISTRY_JFROG_PYPI_TRUST_ALL: ${REGISTRY_JFROG_PYPI_TRUST_ALL:-}
      REGISTRY_UPSTREAM_USERNAME: ${REGISTRY_UPSTREAM_USERNAME:-}
      REGISTRY_UPSTREAM_PASSWORD: ${REGISTRY_UPSTREAM_PASSWORD:-}
      ARTIFACTORY_USER: ${ARTIFACTORY_USER:-}
      ARTIFACTORY_TOKEN: ${ARTIFACTORY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
